{% extends "base.html" %}

{% block title %}Password Changed - Car Dealership{% endblock %}

{% block content %}
<div class="page-header">
    <div class="container-lg">
        <h1><i class="bi bi-shield-check"></i> Password Changed</h1>
        <p>Your password was updated successfully</p>
    </div>
</div>

<div class="container-lg py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 text-center">
            <div class="alert alert-success">
                <i class="bi bi-check-circle"></i>
                Your new password is now active. You're all set to use the staff area.
            </div>
            <a href="{% url 'cars:dashboard' %}" class="btn btn-primary">
                <i class="bi bi-speedometer2"></i> Go to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
