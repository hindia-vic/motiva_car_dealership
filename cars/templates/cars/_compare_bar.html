<!-- Floating compare bar (shared by browse and detail pages) -->
<div id="compareBar" class="d-none fixed-bottom bg-white shadow p-3" style="border-top: 2px solid var(--primary-color); z-index: 1050;">
    <div class="container-lg d-flex justify-content-between align-items-center">
        <span class="text-dark"><strong id="compareCount">0</strong> vehicle(s) selected for comparison</span>
        <div>
            <button type="button" class="btn btn-outline-secondary btn-sm me-2" onclick="clearCompare()">Clear</button>
            <a id="compareLink" href="{% url 'cars:compare' %}" class="btn btn-primary btn-sm">
                <i class="bi bi-arrow-left-right"></i> Compare Now
            </a>
        </div>
    </div>
</div>
