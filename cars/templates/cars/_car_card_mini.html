{% load currency %}
<div class="col-md-6 col-lg-3">
    <div class="card h-100">
        {% with first_image=item.images.first %}
            {% if first_image %}
                <img src="{{ first_image.thumbnail_url }}"
                     srcset="{{ first_image.srcset }}"
                     sizes="(min-width: 992px) 25vw, (min-width: 768px) 50vw, 100vw"
                     loading="lazy" decoding="async"
                     class="card-img-top"
                     style="height: 160px; object-fit: cover;"
                     alt="{{ item.year }} {{ item.make }} {{ item.model }}">
            {% endif %}
        {% endwith %}
        <div class="card-body">
            <h6 class="card-title mb-1">{{ item.year }} {{ item.make }} {{ item.model }}</h6>
            {% if not item.is_available %}
                <span class="badge {{ item.status_badge_class }} mb-1">{{ item.get_status_display }}</span>
            {% endif %}
            <p class="price-tag mb-2">{{ item.asking_price|money }}</p>
            <a href="{% url 'cars:car_detail' item.pk %}" class="btn btn-outline-primary btn-sm w-100">
                <i class="bi bi-eye"></i> View Details
            </a>
        </div>
    </div>
</div>
